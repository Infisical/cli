# Rules appended to the vendored gitleaks config for PAM session log masking.
# Appended as [[rules]] entries, so this file must contain nothing else.

# The vendored ruleset attaches entropy to vendor-specific regexes, so a credential matching no
# known vendor shape (an internal service token, a database password) is never detected. This
# rule covers that gap.
#
# Scoped to tokens rather than whole lines: entropy is measured over the match, and ordinary
# terminal output scores close enough to any useful threshold (prose 4.34, a long path 4.41)
# that a line-wide match would redact legitimate output. At 4.5 the threshold also sits above
# hex's 4.0 ceiling, so no UUID, git SHA or hash digest can ever trip it.
[[rules]]
id = "pam-high-entropy-token"
description = "High-entropy value that may be a credential"
regex = '''[A-Za-z0-9+/_-]{24,}={0,2}'''
entropy = 4.5
keywords = []
