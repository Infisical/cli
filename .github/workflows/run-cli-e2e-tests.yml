name: CLI E2EE Tests

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    name: CLI End-to-End Testing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.9"
      - name: Install dependencies
        run: go get .
      - name: Build the CLI
        run: go build -o infisical-cli
      - name: Checkout infisical repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: infisical/infisical
          path: infisical
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h
      - name: Test with the Go CLI
        run: go test -v -timeout 30m -count=1 github.com/infisical/cli/e2e-tests/proxy github.com/infisical/cli/e2e-tests/relay
        working-directory: ./e2e
        env:
          INFISICAL_BACKEND_DIR: ${{ github.workspace }}/infisical/backend
          INFISICAL_LICENSE_KEY: ${{ secrets.INFISICAL_LICENSE_KEY }}
          INFISICAL_CLI_EXECUTABLE: ${{ github.workspace }}/infisical-cli
          CLI_E2E_DEFAULT_RUN_METHOD: subprocess

  agent-test:
    runs-on: ubuntu-latest
    name: Agent End-to-End Testing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.9"
      - name: Install dependencies
        run: go get .
      - name: Build the CLI
        run: go build -o infisical-cli
      - name: Checkout infisical repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: infisical/infisical
          path: infisical
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h
      - name: Test Certificate Agent
        run: go test -v -timeout 30m -count=1 github.com/infisical/cli/e2e-tests/agent
        working-directory: ./e2e
        env:
          INFISICAL_LICENSE_KEY: ${{ secrets.INFISICAL_LICENSE_KEY }}
          INFISICAL_BACKEND_DIR: ${{ github.workspace }}/infisical/backend
          INFISICAL_CLI_EXECUTABLE: ${{ github.workspace }}/infisical-cli
          CLI_E2E_DEFAULT_RUN_METHOD: subprocess
  pam-test:
    runs-on: ubuntu-latest
    name: PAM End-to-End Testing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.9"
      - name: Install dependencies
        run: go get .
      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/pam/handlers/rdp/native/target
          key: rdp-bridge-cargo-${{ runner.os }}-${{ hashFiles('packages/pam/handlers/rdp/native/Cargo.lock') }}
          restore-keys: rdp-bridge-cargo-${{ runner.os }}-
      - name: Install pinned Rust toolchain
        working-directory: packages/pam/handlers/rdp/native
        run: rustup show active-toolchain
      - name: Build Rust RDP bridge
        working-directory: packages/pam/handlers/rdp/native
        run: cargo build --release
      - name: Build the CLI
        run: CGO_ENABLED=1 go build -tags rdp -o infisical-cli
      - name: Install RDP test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends freerdp3-x11 xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Checkout infisical repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: infisical/infisical
          path: infisical
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h
      - name: Test PAM Resources
        run: go test -v -timeout 30m -count=1 github.com/infisical/cli/e2e-tests/pam
        working-directory: ./e2e
        env:
          INFISICAL_BACKEND_DIR: ${{ github.workspace }}/infisical/backend
          INFISICAL_LICENSE_KEY: ${{ secrets.INFISICAL_LICENSE_KEY }}
          INFISICAL_CLI_EXECUTABLE: ${{ github.workspace }}/infisical-cli
          CLI_E2E_DEFAULT_RUN_METHOD: subprocess

  os-specific-test:
    runs-on: ${{ matrix.os }}
    name: OS-Specific Testing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.9"
      - name: Build the CLI
        run: go build -o infisical-cli${{ runner.os == 'Windows' && '.exe' || '' }}
      # --exit-code 0 so leaks in test fixtures don't fail the job; a failed git scan still exits 1.
      - name: Run infisical scan
        run: ./infisical-cli scan -v --exit-code 0
      # -vet=off: packages/cmd/run.go has existing printf vet failures.
      # TestProcessTemplate is the Windows regression check for backslash source-paths in agent templates.
      - name: Run agent unit tests
        run: go test -vet=off -count=1 -run 'TestProcessTemplate|AgentService|SystemdQuoteArg|AgentSystemdUnit' ./packages/cmd/
      # The agent points at a closed port, so auth keeps failing and being retried and the service stays up.
      # Auth failing on the network rather than on reading ./client-id proves relative paths resolve from the config's directory.
      - name: Test agent service (systemd)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/agent-service"
          mkdir -p "$dir"
          echo "client-id" > "$dir/client-id"
          echo "client-secret" > "$dir/client-secret"
          cat > "$dir/agent-config.yaml" <<'EOF'
          infisical:
            address: "http://127.0.0.1:1"
          auth:
            type: "universal-auth"
            config:
              client-id: "./client-id"
              client-secret: "./client-secret"
          EOF

          sudo ./infisical-cli agent service install ci-agent --config "$dir/agent-config.yaml" --log-file "$dir/agent.log"
          # Type=notify: start only returns once the agent reported it is ready
          sudo ./infisical-cli agent service start ci-agent
          systemctl is-active --quiet ci-agent

          for _ in $(seq 1 60); do
            sudo grep -q "unable to authenticate" "$dir/agent.log" && break
            sleep 1
          done
          sudo cat "$dir/agent.log"
          sudo grep -q "unable to authenticate" "$dir/agent.log"
          if sudo grep -q "unable to get client id" "$dir/agent.log"; then
            echo "client-id was not resolved from the config directory"
            exit 1
          fi

          sudo ./infisical-cli agent service stop ci-agent
          if systemctl is-active --quiet ci-agent; then
            echo "service is still active after stop"
            exit 1
          fi

          sudo ./infisical-cli agent service uninstall ci-agent
          test ! -e /etc/systemd/system/ci-agent.service
      - name: Test agent service (Windows Service Control Manager)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:RUNNER_TEMP 'agent-service'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'client-id') -Value 'client-id'
          Set-Content -Path (Join-Path $dir 'client-secret') -Value 'client-secret'
          Set-Content -Path (Join-Path $dir 'agent-config.yaml') -Value @"
          infisical:
            address: "http://127.0.0.1:1"
          auth:
            type: "universal-auth"
            config:
              client-id: "./client-id"
              client-secret: "./client-secret"
          "@
          $log = Join-Path $env:ProgramData 'Infisical\Agent\ci-agent.log'

          ./infisical-cli.exe agent service install ci-agent --config (Join-Path $dir 'agent-config.yaml')
          ./infisical-cli.exe agent service start ci-agent
          if ((Get-Service ci-agent).Status -ne 'Running') { throw 'service is not running after start' }

          $deadline = (Get-Date).AddSeconds(60)
          while (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'unable to authenticate' -Quiet))) {
            if ((Get-Date) -gt $deadline) { throw 'the agent did not log an authentication attempt' }
            Start-Sleep -Seconds 1
          }
          Get-Content $log
          if (Select-String -Path $log -Pattern 'unable to get client id' -Quiet) { throw 'client-id was not resolved from the config directory' }

          # errors are copied into the Application event log under the service name
          $errors = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'ci-agent'; Level = 2 } -MaxEvents 5
          $errors | Format-List TimeCreated, Message

          ./infisical-cli.exe agent service stop ci-agent
          if ((Get-Service ci-agent).Status -ne 'Stopped') { throw 'service did not stop' }

          ./infisical-cli.exe agent service uninstall ci-agent
          # the SCM removes a deleted service once the last handle to it closes
          $deadline = (Get-Date).AddSeconds(15)
          while (Get-Service ci-agent -ErrorAction SilentlyContinue) {
            if ((Get-Date) -gt $deadline) { throw 'service still exists after uninstall' }
            Start-Sleep -Seconds 1
          }
